# Nginx Server Block Configuration for Fabbit.org
# Place this inside /etc/nginx/sites-available/fabbit and symlink to sites-enabled/

# Rate Limiting configuration (protects against brute-force/DDoS attacks)
limit_req_zone $binary_remote_addr zone=fabbit_limit:10m rate=30r/s;

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fabbit.org www.fabbit.org;

    # Let's Encrypt validation endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Reverse Proxy and static caching
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fabbit.org www.fabbit.org;

    # SSL Certificate paths (configured via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/fabbit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fabbit.org/privkey.pem;

    # Optimized SSL Configurations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss:; img-src 'self' https: data:; font-src 'self' https: data:;" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression configurations
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 5;

    # Proxy root requests to the Node/Docker Next.js server running on port 3000
    location / {
        limit_req zone=fabbit_limit burst=20 nodelay;
        
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Static Assets Cache Optimization (Cache static bundles for 1 year)
    location /_next/static/ {
        alias /var/www/fabbit/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Static Files Cache Optimization (Images, icons, metadata)
    location /public/ {
        alias /var/www/fabbit/public/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
    }
}
